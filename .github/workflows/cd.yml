name: CD

# Deploy to Railway on every push to main.
# Assumes GitHub Secrets are configured:
#   DATABASE_URL        — Neon pooler connection string
#   RAILWAY_TOKEN       — Railway API token (railway whoami --token)
#   RAILWAY_PROJECT_ID  — Railway project ID (visible in Railway dashboard URL)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Migrate + Deploy to Railway
    runs-on: ubuntu-latest

    # Set DATABASE_URL at job level so every step inherits it.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate DATABASE_URL is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not configured in GitHub repository secrets."
            exit 1
          fi
          echo "DATABASE_URL is set (starts with: ${DATABASE_URL:0:20}...)"

      - name: Generate Prisma client
        run: npx prisma generate

      # Run migrations against the production database BEFORE Railway pulls
      # the new image, so the schema is always up-to-date before traffic
      # switches over.
      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Deploy to Railway
        run: |
          npm install -g @railway/cli@3
          railway up
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
