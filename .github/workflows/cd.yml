name: CD

# Deploy to Vercel on every push to main.
# Assumes GitHub Secrets are configured:
#   DATABASE_URL        — Neon connection string
#   VERCEL_TOKEN        — Vercel API token (vercel.com/account/tokens)
#   VERCEL_ORG_ID       — found in Vercel project Settings → General
#   VERCEL_PROJECT_ID   — found in Vercel project Settings → General
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Migrate + Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Run migrations against the production database BEFORE Vercel deploys
      # the new code, so the schema is always up-to-date before traffic
      # switches over.
      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
